name: Repository gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jpyxis-repository-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify blueprint repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verify M0 blueprint
        run: node scripts/verify-blueprint.mjs
