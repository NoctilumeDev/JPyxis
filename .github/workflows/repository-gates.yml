name: Repository gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jpyxis-repository-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify M1 contract repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Verify repository boundary
        run: node scripts/verify-repository.mjs
      - name: Verify M1 cross-binding conformance
        run: node scripts/verify-m1.mjs
      - name: Retain M1 conformance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m1-conformance-${{ github.sha }}
          path: build/m1
          if-no-files-found: ignore
          retention-days: 14
