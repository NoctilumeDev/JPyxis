name: Repository gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jpyxis-repository-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify M5 resilience repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            invocation/python/requirements-m2.txt
            invocation/python/requirements-m3.txt
      - name: Verify repository boundary
        run: node scripts/verify-repository.mjs
      - name: Verify M1 cross-binding conformance
        run: node scripts/verify-m1.mjs
      - name: Verify M2 invocation closure
        run: node scripts/verify-m2.mjs
      - name: Verify M3 runtime abstraction
        run: node scripts/verify-m3.mjs
      - name: Verify M4 lifecycle
        run: node scripts/verify-m4.mjs
      - name: Verify M5 resilience candidate
        run: node scripts/verify-m5.mjs
      - name: Retain M1 conformance reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m1-conformance-${{ github.sha }}
          path: build/m1
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain M2 invocation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-invocation-${{ github.sha }}
          path: |
            build/m2/conformance-summary.json
            build/m2/runs
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain M3 runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m3-runtime-${{ github.sha }}
          path: |
            build/m3/conformance-summary.json
            build/m3/runs
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain M4 lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m4-lifecycle-${{ github.sha }}
          path: |
            build/m4/conformance-summary.json
            build/m4/runs
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain M5 resilience evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m5-resilience-${{ github.sha }}
          path: |
            build/m5/conformance-summary.json
            build/m5/runs
          if-no-files-found: ignore
          retention-days: 14
